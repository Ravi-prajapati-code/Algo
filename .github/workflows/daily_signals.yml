name: Daily Signal Generation

on:
  schedule:
    # 10:30 UTC = 4:00 PM IST — runs after NSE market close (3:30 PM IST)
    - cron: '30 10 * * 1-5'   # weekdays only (Mon–Fri)
  workflow_dispatch:            # also allow manual trigger for testing

jobs:
  generate-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0          # full history so we can commit db back

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Initialise DB (idempotent)
        run: python main.py initdb

      - name: Run daily signal pipeline
        env:
          INITIAL_CAPITAL:    ${{ secrets.INITIAL_CAPITAL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python runner/daily_runner.py

      - name: Commit updated outputs back to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/signals.json outputs/portfolio_state.json db/trading.db || true
          git diff --cached --quiet || git commit -m "chore: daily signals $(date -u +%Y-%m-%d)"
          git push origin ${{ github.ref_name }}
